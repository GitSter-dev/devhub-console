<div class="login">
  <form class="card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="brand"><i class="pi pi-shield"></i> DevHub console</div>
    <p class="muted">Sign in with your moderator account, not the one on your phone.</p>

    @if (notice(); as notice) {
      <p-message severity="info">{{ notice }}</p-message>
    }
    @if (error(); as error) {
      <p-message severity="error">{{ error }}</p-message>
    }

    <label for="identifier">Email or username</label>
    <input
      pInputText
      id="identifier"
      formControlName="identifier"
      autocomplete="username"
      autofocus
      [invalid]="form.controls.identifier.invalid && form.controls.identifier.touched"
    />

    <label for="password">Password</label>
    <input
      pInputText
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      [invalid]="form.controls.password.invalid && form.controls.password.touched"
    />

    <p-button type="submit" label="Sign in" [loading]="submitting()" styleClass="submit" />
  </form>
</div>
